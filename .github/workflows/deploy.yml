# استقرار خودکار سایت دفاع روی GitHub Pages
# پس از هر push به شاخه main یا master، سایت build شده و منتشر می‌شود.
# دامنه اختصاصی: thesis.farhadipour.com
#
# ⚠️ برای فعال‌سازی این workflow باید در تنظیمات ریپو:
#    Settings → Pages → Build and deployment → Source = GitHub Actions
#    (اگر Source روی «Deploy from a branch» باشد، workflow سیستم گیت‌هاب
#     به نام pages-build-deployment اجرا می‌شود و در step «publish» fail می‌شود)

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch: # امکان اجرای دستی از تب Actions

permissions:
  contents: read
  pages: write
  id-token: write

# جلوگیری از اجرای موازی چند deploy
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build static site
        run: bun run build:static
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # اطمینان از وجود CNAME و .nojekyll در خروجی
      - name: Add CNAME and .nojekyll
        run: |
          touch out/.nojekyll
          echo "thesis.farhadipour.com" > out/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./out"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
